<div class="checkin-wrapper">

  <!-- En-tête avec logo -->
  <div class="header">
    <div class="logo-zone">
      <img src="logo.png" alt="Dockt" class="logo-img" />
    </div>
  </div>

  <!-- Contenu principal -->
  <div class="main-content">

    <!-- Zone caméra — toujours visible pour les overlays résultat -->
    <div class="camera-container">

      <!-- Placeholder — état initial uniquement -->
      <div *ngIf="!cameraActive && messageClass === 'info'"
           class="camera-placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1" width="64" height="64" class="placeholder-icon">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M6.827 6.175A2.31 2.31 0 015.186 7.23
                   c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507
                   2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25
                   0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169
                   a47.865 47.865 0 00-1.134-.175 2.31 2.31 0
                   01-1.64-1.055l-.822-1.316a2.192 2.192 0
                   00-1.736-1.039 48.774 48.774 0 00-5.232 0
                   2.192 2.192 0 00-1.736 1.039l-.821 1.316z"/>
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019
                   0zM18.75 10.5h.008v.008h-.008V10.5z"/>
        </svg>
        <p class="placeholder-text">
          Cliquez sur le bouton pour activer la caméra
        </p>
      </div>

      <!-- Flux vidéo en direct -->
      <video #videoElement
             autoplay muted playsinline
             [class.visible]="cameraActive"
             class="video-feed">
      </video>

      <!-- Canvas overlay — rectangle jaune guide -->
      <canvas #overlayCanvas
              class="detection-overlay"
              [class.visible]="cameraActive && messageClass !== 'success' && messageClass !== 'error' && messageClass !== 'warning'">
      </canvas>

      <!-- ── Overlay SUCCÈS ── -->
      <div *ngIf="messageClass === 'success' && !cameraActive"
           class="result-overlay succes">
        <div class="result-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" width="56" height="56">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M9 12.75L11.25 15 15 9.75
                     M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </div>
        <p class="result-message">{{ message }}</p>
        <p class="result-sous">{{ sousMessage }}</p>
      </div>

      <!-- ── Overlay NON RECONNU / ERREUR ── -->
      <div *ngIf="messageClass === 'error' && !cameraActive"
           class="result-overlay non_reconnu">
        <div class="result-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" width="56" height="56">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5
                     M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </div>
        <p class="result-message">{{ message }}</p>
        <p class="result-sous">{{ sousMessage }}</p>
      </div>

      <!-- Badge nouveau patient -->
      <div *ngIf="patientEnAttente && cameraActive"
           class="badge-nouveau">
        📸 Nouveau patient
      </div>

      <!-- Indicateur traitement (3 points) -->
      <div *ngIf="isProcessing && cameraActive"
           class="processing-indicator">
        <div class="processing-dot"></div>
        <div class="processing-dot"></div>
        <div class="processing-dot"></div>
      </div>

    </div>

    <!-- Bouton démarrer — visible uniquement si caméra inactive, pas en succès/erreur -->
    <button *ngIf="!cameraActive && !isProcessing && !patientEnAttente && messageClass === 'info'"
            class="btn-camera"
            (click)="demarrerScan()">
      <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
        <path fill-rule="evenodd"
              d="M1.5 6a2.25 2.25 0 012.25-2.25h16.5A2.25 2.25 0
                 0122.5 6v12a2.25 2.25 0 01-2.25 2.25H3.75A2.25 2.25
                 0 011.5 18V6zM3 16.06V18c0 .414.336.75.75.75h16.5
                 A.75.75 0 0021 18v-1.94l-2.69-2.689a1.5 1.5 0
                 00-2.12 0l-2.5 2.5-1.69-1.69a1.5 1.5 0
                 00-2.12 0L3 16.061zm10.125-7.81a1.125 1.125 0
                 112.25 0 1.125 1.125 0 01-2.25 0z"
              clip-rule="evenodd"/>
      </svg>
      <span>Scanner ma présence</span>
    </button>

    <!-- Pied de page -->
    <div class="footer-hint">
      <p>👤 Patient existant : cliquez sur "Scanner ma présence"</p>
      <p>📸 Nouveau patient : la capture démarre automatiquement</p>
    </div>

  </div>
</div>
